<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unbound | Beyond Boundaries</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        /* NAVBAR */

        nav {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;

            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(15px);

            position: fixed;
            width: 100%;
            top: 0;
            z-index: 10;

            border-bottom: 1px solid #eeeeee;
        }

        .logo {
             display: flex;
            align-items: center;
             gap: 12px;
             font-size: 21px;
             font-weight: 800;
             letter-spacing: 1px;
        }

        .logo img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: contain;
            display: block;
        }

        .hero-logo {
            width: min(360px, 75vw);
            max-height: 250px;
            object-fit: contain;
            display: block;
            margin: 0 auto 28px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 30px;
            font-size: 15px;
        }

        nav a:hover {
            color: #7048e8;
        }

        /* HERO */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 120px 20px 80px;

            background:
                radial-gradient(circle at 15% 25%, #eee7ff, transparent 30%),
                radial-gradient(circle at 85% 75%, #e5f9ff, transparent 30%),
                white;
        }

        .hero-content {
            max-width: 900px;
        }

        .small-text {
            display: inline-block;

            padding: 9px 18px;

            border-radius: 50px;

            background: #f3efff;
            color: #7048e8;

            font-weight: 600;

            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: clamp(60px, 10vw, 120px);
            line-height: 0.95;

            letter-spacing: -5px;

            margin-bottom: 30px;
        }

        .gradient {
            background: linear-gradient(90deg, #7048e8, #12a8d8);

            -webkit-background-clip: text;
            color: transparent;
        }

        .hero p {
            font-size: 21px;
            color: #666;

            max-width: 650px;
            margin: auto;

            line-height: 1.6;
        }

        /* BUTTON */

        .button {
            display: inline-block;

            margin-top: 40px;

            padding: 17px 38px;

            border-radius: 50px;

            background: #111;
            color: white;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s;

            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .button:hover {
            transform: translateY(-4px);

            background: linear-gradient(90deg,#7048e8,#12a8d8);

            box-shadow: 0 15px 35px rgba(112,72,232,0.3);
        }

        /* FLOATING SHAPE */

        .circle {
            position: absolute;

            width: 100px;
            height: 100px;

            border-radius: 50%;

            background: linear-gradient(135deg,#7048e8,#12a8d8);

            opacity: 0.12;

            top: 25%;
            left: 8%;
        }

        .circle2 {
            position: absolute;

            width: 160px;
            height: 160px;

            border-radius: 40px;

            background: #7048e8;

            opacity: 0.08;

            bottom: 15%;
            right: 8%;

            transform: rotate(20deg);
        }

        /* FOOTER */

        footer {
            text-align: center;

            padding: 30px;

            border-top: 1px solid #eeeeee;

            color: #888;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            <img src="unbound_circle.png" alt="Unbound Logo">
            <span>Unbound</span>
        </div>

        <div>
            <a href="index.html">Home</a>
            <a href="webpage.html">About</a>
        </div>

    </nav>


    <div class="circle"></div>
    <div class="circle2"></div>


    <section class="hero">

        <div class="hero-content">

            <img class="hero-logo" src="unbound_full_logo.png" alt="Unbound - Beyond Boundaries">

            <div class="small-text">
                BEYOND BOUNDARIES
            </div>

            <h1>
                Think
                <span class="gradient">
                    Unbound.
                </span>
            </h1>

            <p>
                We create innovative ideas and technology
                designed to push boundaries and solve
                real-world problems.
            </p>

            <a href="webpage.html" class="button">
                Explore Unbound →
            </a>

        </div>

    </section>


    <footer>
        © 2026 Unbound · Beyond Boundaries
    </footer>

</body>
</html>
